name: Native Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test native Windows stack
        run: .\scripts\test-all.ps1 -Python (Get-Command python.exe).Source
      - name: Start, simulate through Vite proxy, and check idempotent launch
        run: |
          try {
            .\start.ps1 -Python (Get-Command python.exe).Source
            if ($LASTEXITCODE -ne 0) { throw 'Startup failed' }
            .\start.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Repeated startup failed' }
            $health = Invoke-RestMethod http://127.0.0.1:5173/api/health
            if (-not $health.sim_core_available) { throw 'Native core unavailable through frontend proxy' }
            $body = @{ circuit = @{ version = '1.0'; devices = @(@{ id = 'v'; type = 'VCC'; x = 0; y = 0; params = @{} }); wires = @() }; options = @{ max_ticks = 10; record_all = $true } } | ConvertTo-Json -Depth 10
            $result = Invoke-RestMethod http://127.0.0.1:5173/api/simulations/run -Method Post -ContentType application/json -Body $body
            if ($result.status -ne 'ok' -or $result.final_nodes.'v.OUT' -ne '1') { throw 'Native simulation failed' }
          } finally { .\start.ps1 -Stop }
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: .logs/windows/
          if-no-files-found: ignore
          include-hidden-files: true
