name: Windows Installer

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'sim-core/**'
      - 'bindings/**'
      - 'device-library/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'docs/安装包说明.md'
      - '.github/workflows/installer.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install installer compiler
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Installer compiler checksum mismatch' }
          $compiler = Join-Path $env:RUNNER_TEMP 'Inno Setup 6'
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/PORTABLE=1', '/NOICONS', ('/DIR="' + $compiler + '"')) -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Installer compiler setup failed' }
      - name: Build self-contained installer
        run: .\scripts\package-windows.ps1 -Python (Get-Command python.exe).Source -InnoSetup (Join-Path $env:RUNNER_TEMP 'Inno Setup 6/ISCC.exe')
      - name: Install, exercise and uninstall the built application
        run: .\scripts\test-installer.ps1 -Installer .\dist\installers\LogicLab-1.0.0-Windows-x64-Setup.exe
      - name: Upload verified installer and guide
        uses: actions/upload-artifact@v4
        with:
          name: LogicLab-Windows-x64-installer
          path: dist/installers/
          if-no-files-found: error
          retention-days: 30
